[time]
startYear = 2000
endYear = 2000
timeType = sixhourly_noleap

[input_mesh]
meshDir =
meshFilename = /t_10/t_10.2000.nc
latDimname = LAT
lonDimname = LON
latVarname = LAT
lonVarname = LON

[input_fields]
inputDir =
filenameTemplatesIn =
                    /t_10/t_10.$Y.*nc
                    /q_10/q_10.$Y.*nc
                    /u_10/u_10.$Y.*nc
                    /v_10/v_10.$Y.*nc
varnamesIn =
           T_10_MOD
           Q_10_MOD
           U_10_MOD
           V_10_MOD

[output]
filenameMPASGrid =
outputDir = tmp
filenameOutTemplate = forcing_CORE-II_six_hourly.$Y.nc
varnamesOut =
            airTemperature
            airSpecificHumidity
            uAirVelocity
            vAirVelocity
