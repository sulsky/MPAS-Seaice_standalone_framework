[time]
startYear = 2000
endYear = 2000
timeType = sixhourly_gregorian

[input_mesh]
meshDir =
meshFilename = /tmp2m/tmp2m.2000.nc
latDimname = lat
lonDimname = lon
latVarname = lat
lonVarname = lon

[input_fields]
inputDir =
filenameTemplatesIn =
                    /tmp2m/tmp2m.$Y.nc
                    /spfh2m/spfh2m.$Y.nc
                    /ugrd10m/ugrd10m.$Y.nc
                    /vgrd10m/vgrd10m.$Y.nc
varnamesIn =
           tmp2m-hgt-an-ll125
           spfh2m-hgt-an-ll125
           ugrd10m-hgt-an-ll125
           vgrd10m-hgt-an-ll125

[output]
filenameMPASGrid =
outputDir = tmp-JRA
filenameOutTemplate = forcing_JRA-3Q_six_hourly.$Y.nc
varnamesOut =
            airTemperature
            airSpecificHumidity
            uAirVelocity
            vAirVelocity
